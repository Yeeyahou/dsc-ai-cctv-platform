<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSC 현장 CCTV 실시간 보기</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">FutureX DSC</p><h1>현장 CCTV 실시간 보기</h1></div><button id="login">회사 계정 로그인</button><button id="logout" hidden>로그아웃</button></header>
<p>접근 권한이 있는 카메라를 선택하세요. 실시간 영상은 현장 연결 상태에 따라 중단될 수 있습니다.</p>
<section aria-label="카메라 선택"><label for="camera">카메라</label><select id="camera" disabled><option>로그인이 필요합니다</option></select><button id="start" disabled>실시간 보기</button><button id="stop" disabled>시청 종료</button></section>
<p id="status" role="status" aria-live="polite">로그인 후 카메라 목록을 확인할 수 있습니다.</p>
<div class="screen"><video id="video" autoplay muted playsinline controls></video><p id="overlay">시청 중인 영상이 없습니다</p></div>
<p class="note">시청 연결은 최대 5분이며 로그인 만료 시 더 일찍 종료됩니다. 만료 후 다시 보기를 누르세요. 녹화 클립은 기존 이력 조회에서 확인합니다.</p>
</main></body></html>
