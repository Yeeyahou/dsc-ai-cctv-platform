services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dsc_test
      POSTGRES_USER: dsc_test
      POSTGRES_PASSWORD: local-test-only
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dsc_test -d dsc_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs: [/var/lib/postgresql/data]
