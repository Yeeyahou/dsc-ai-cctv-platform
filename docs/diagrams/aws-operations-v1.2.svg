<polygon points="1400,535 1388,530 1388,540" fill="#586575"/>
<text x="1295" y="508" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#586575">E05  HTTPS 443</text>
<rect x="35" y="675" width="2330" height="410" rx="8" fill="#F7F9FB" stroke="#A3ADB8" stroke-width="2" stroke-dasharray="10 7"/>
<text x="57" y="714" text-anchor="start" font-family="Nanum Gothic, sans-serif" font-size="27" font-weight="700" fill="#172431">유지관리 논리 호출  |  동일 DB·큐·버킷을 재표시</text>
