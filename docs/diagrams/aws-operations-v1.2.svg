<text x="940.0" y="1317" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">API·함수 로그와 메트릭</text>
<text x="940.0" y="1359" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">분산 요청 추적</text>
<text x="940.0" y="1401" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">이벤트·작업 추적 ID 구분</text>
<rect x="1370" y="1240" width="380" height="190" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="1560.0" y="1279" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="24" font-weight="700" fill="#172431">CloudWatch 경보</text>
<text x="1560.0" y="1317" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#172431">API 5xx / 유지관리 오류</text>
<text x="1560.0" y="1359" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#172431">사본 격리 / 디스크 부족</text>
<text x="1560.0" y="1401" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#172431">메시지 자동 발송은 현 범위 밖</text>
<rect x="1870" y="1240" width="430" height="250" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="2085.0" y="1279" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="25" font-weight="700" fill="#172431">S3 접근 감사 경로</text>
<text x="2085.0" y="1317.0" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">ClipBucket → AuditBucket</text>
<text x="2085.0" y="1358.0" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">S3 서버 접근 로그</text>
<text x="2085.0" y="1399.0" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">CloudTrail 데이터 이벤트는</text>
<text x="2085.0" y="1440.0" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">ClipAuditMode에 따라 구성</text>
<text x="2085.0" y="1481.0" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">synthetic 개발은 합성 클립만</text>
<polyline points="520,1335 730,1335" fill="none" stroke="#586575" stroke-width="2.6" />
<polygon points="730,1335 718,1330 718,1340" fill="#586575"/>
<text x="625" y="1308" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#586575">E07a  로그·추적</text>
<polyline points="1150,1335 1370,1335" fill="none" stroke="#586575" stroke-width="2.6" />
<polygon points="1370,1335 1358,1330 1358,1340" fill="#586575"/>
<text x="1260" y="1308" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#586575">E07b  지표·필터</text>
<text x="45" y="1605" text-anchor="start" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">E09는 각 실행 역할·설치별 인증·버킷/큐 정책의 권한 관계다. 네트워크 선으로 표현하지 않으며 문서의 역할별 권한표를 따른다.</text>
