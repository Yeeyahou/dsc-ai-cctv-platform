<text x="2130.0" y="852" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">현재 작업·URL 기한 보호</text>
<text x="2130.0" y="894" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">삭제 가능 시점 후 DELETE</text>
