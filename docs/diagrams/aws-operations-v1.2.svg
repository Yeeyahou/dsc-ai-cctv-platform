<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1640" viewBox="0 0 2400 1640" role="img">
<title>AWS 배포 경계와 유지관리 및 운영 관측</title><desc>네트워크·예약 처리·관측의 세 관계를 나누어 표시한다. 반복 표시는 같은 리소스이며 별도 복제 서버를 뜻하지 않는다.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="45" y="48" text-anchor="start" font-family="Nanum Gothic, sans-serif" font-size="34" font-weight="700" fill="#172431">AWS 배포 경계와 유지관리 및 운영 관측</text>
<text x="45" y="91" text-anchor="start" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#586575">네트워크·예약 처리·관측의 세 관계를 나누어 표시한다. 반복 표시는 같은 리소스이며 별도 복제 서버를 뜻하지 않는다.</text>
<rect x="35" y="135" width="2330" height="490" rx="8" fill="#F7F9FB" stroke="#A3ADB8" stroke-width="2" stroke-dasharray="10 7"/>
<text x="57" y="174" text-anchor="start" font-family="Nanum Gothic, sans-serif" font-size="27" font-weight="700" fill="#172431">네트워크 경로  |  Lambda·DB private / NAT public / 나머지는 AWS 관리 서비스</text>
<rect x="100" y="290" width="430" height="170" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="315.0" y="329" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">API / Maintenance Lambda</text>
<text x="315.0" y="367" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">private subnet A/B에 VPC 연결</text>
<text x="315.0" y="409" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">서로 다른 실행 역할 / SG 공유</text>
<text x="315.0" y="451" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">Lambda 서비스 호출로 실행</text>
<rect x="760" y="260" width="430" height="150" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="975.0" y="299" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">RDS PostgreSQL</text>
<text x="975.0" y="337" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">private · 암호화 · TLS 5432</text>
<text x="975.0" y="379" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">Lambda SG만 허용 / 백업 14일</text>
<rect x="760" y="465" width="430" height="140" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="975.0" y="504" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">개발 NAT Gateway</text>
<text x="975.0" y="542" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">public subnet / 단일 AZ</text>
<text x="975.0" y="584" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">두 private subnet의 outbound</text>
<rect x="1400" y="260" width="350" height="150" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="1575.0" y="299" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">S3 Gateway Endpoint</text>
<text x="1575.0" y="337" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">private route table 연결</text>
<text x="1575.0" y="379" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">두 함수의 S3 경로</text>
<rect x="1950" y="260" width="350" height="150" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="2125.0" y="299" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">S3 ClipBucket</text>
<text x="2125.0" y="337" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">HEAD 실제 크기·SHA-256</text>
<text x="2125.0" y="379" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">이전 객체 DELETE</text>
