<text x="1850.0" y="504" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">AWS HTTPS Endpoint</text>
<text x="1850.0" y="542" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">SQS 설치별 큐·DLQ / Secrets Manager / Cognito JWKS</text>
<text x="1850.0" y="584" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">SQS 송수신·재발행 / DB·cursor 비밀 / 검증용 공개키</text>
