<polyline points="925,925 925,1010 2130,1010 2130,925" fill="none" stroke="#A44F11" stroke-width="2.6" />
<polygon points="2130,925 2125,937 2135,937" fill="#A44F11"/>
<text x="1530" y="1048" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#A44F11">E08  안전 조건 후 객체 정리</text>
<rect x="35" y="1135" width="2330" height="430" rx="8" fill="#F7F9FB" stroke="#A3ADB8" stroke-width="2" stroke-dasharray="10 7"/>
<text x="57" y="1174" text-anchor="start" font-family="Nanum Gothic, sans-serif" font-size="27" font-weight="700" fill="#172431">관측과 감사 경로  |  현장·사무실의 로컬 로그는 journal 또는 컨테이너 로그에 남음</text>
<rect x="100" y="1240" width="420" height="190" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="310.0" y="1279" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="25" font-weight="700" fill="#172431">API Gateway / 두 Lambda</text>
<text x="310.0" y="1317" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">API 접근 로그 / 구조화 실행 로그</text>
<text x="310.0" y="1359" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">함수 추적 / heartbeat 통계</text>
<text x="310.0" y="1401" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="22" font-weight="400" fill="#172431">비밀·본문·서명 URL 미기록</text>
