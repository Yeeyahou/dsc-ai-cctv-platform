<text x="300.0" y="814" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">EventBridge 예약 규칙</text>
<text x="300.0" y="852" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">rate(1 minute)</text>
<text x="300.0" y="894" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">SAM Schedule</text>
