<polyline points="315,290 315,220 1575,220 1575,260" fill="none" stroke="#A44F11" stroke-width="2.6" />
<polygon points="1575,260 1570,248 1580,248" fill="#A44F11"/>
<text x="1000" y="207" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="21" font-weight="400" fill="#A44F11">E06a  S3 서비스 호출</text>
<polyline points="1750,335 1950,335" fill="none" stroke="#A44F11" stroke-width="2.6" />
<polygon points="1950,335 1938,330 1938,340" fill="#A44F11"/>
