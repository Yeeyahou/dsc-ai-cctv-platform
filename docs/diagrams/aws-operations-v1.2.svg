<text x="925.0" y="814" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">MaintenanceFunction</text>
<text x="925.0" y="852" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">lease·기한·미수락 점검</text>
<text x="925.0" y="894" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">재발행·재배정 / 정리</text>
<rect x="1410" y="775" width="400" height="150" rx="6" fill="white" stroke="#235D92" stroke-width="2.4"/>
<text x="1610.0" y="814" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="26" font-weight="700" fill="#172431">PostgreSQL / 설치별 SQS</text>
<text x="1610.0" y="852" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">DB 상태·배정 갱신</text>
<text x="1610.0" y="894" text-anchor="middle" font-family="Nanum Gothic, sans-serif" font-size="23" font-weight="400" fill="#172431">전송 실패 작업 재발행</text>
